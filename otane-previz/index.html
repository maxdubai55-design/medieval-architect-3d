<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTANE — Previz</title>
<style>
  :root { --bg:#07090b; --fg:#e6ebe8; --mut:#8c9893; --acc:#5ef0a6; --line:#1d2428; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family: Inter, system-ui, sans-serif; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  #stage canvas { width: 100%; height: auto; display:block; background:#000; }
  header { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
  header h1 { font-weight:300; letter-spacing:6px; font-size:22px; margin:0; }
  header span { color:var(--mut); font-size:13px; }
  #bar { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  button, select { background:#11171a; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  input[type=range] { flex:1; min-width:180px; accent-color: var(--acc); }
  #tc { font-family: ui-monospace, monospace; font-size:12px; color:var(--mut); min-width: 110px; }
  #scenes { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:8px; margin-top:16px; }
  #scenes button { text-align:left; padding:10px; line-height:1.35; }
  #scenes button b { display:block; font-weight:600; font-size:13px; }
  #scenes button small { color:var(--mut); font-size:11px; }
  #scenes button.on { border-color:var(--acc); }
  body.render #wrap { padding:0; max-width:none; }
  body.render header, body.render #bar, body.render #scenes { display:none; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<div id="wrap">
  <header><h1>OTANE</h1><span>Le Cœur des mondes — prévisualisation des scènes clés</span></header>
  <div id="stage"></div>
  <div id="bar">
    <button id="play">▶ Lecture</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="tc">00:00 / 00:00</span>
    <button id="slate">Slate : oui</button>
    <label style="font-size:13px;color:var(--mut)"><input id="chain" type="checkbox" checked> enchaîner</label>
  </div>
  <div id="scenes"></div>
</div>
<script type="module">
import { Film } from './src/engine.js';
import { SCENES } from './src/scenes/index.js';

const qs = new URLSearchParams(location.search);
const render = qs.has('render');
if (render) document.body.classList.add('render');
const film = new Film(document.getElementById('stage'), { slate: qs.get('slate') !== '0' });
let cur = 0, t = 0, playing = false, last = 0;

async function load(i) {
  cur = i;
  const mod = (await SCENES[i].load()).default;
  film.load(mod);
  t = 0;
  film.frame(0);
  document.querySelectorAll('#scenes button').forEach((b, k) => b.classList.toggle('on', k === i));
  updateUI();
}
function fmt(s) { s = Math.floor(s); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
function updateUI() {
  if (render) return;
  document.getElementById('seek').value = Math.round((t / film.duration) * 1000);
  document.getElementById('tc').textContent = `${fmt(t)} / ${fmt(film.duration)}`;
}

if (render) {
  const idx = SCENES.findIndex((s) => s.id === qs.get('scene'));
  await load(Math.max(0, idx));
  window.duration = film.duration;
  window.seek = (time) => { film.frame(time); };
  window.grab = (q = 0.92) => film.out.toDataURL('image/jpeg', q);
  window.ready = true;
} else {
  const list = document.getElementById('scenes');
  for (const [i, s] of SCENES.entries()) {
    const b = document.createElement('button');
    b.innerHTML = `<b>${s.id} · ${s.title}</b><small>${s.chapter}</small>`;
    b.onclick = () => load(i);
    list.appendChild(b);
  }
  document.getElementById('play').onclick = () => {
    playing = !playing;
    document.getElementById('play').textContent = playing ? '❚❚ Pause' : '▶ Lecture';
    last = performance.now();
  };
  document.getElementById('seek').oninput = (e) => { t = (e.target.value / 1000) * film.duration; film.frame(t); updateUI(); };
  document.getElementById('slate').onclick = (e) => { film.slate = !film.slate; e.target.textContent = `Slate : ${film.slate ? 'oui' : 'non'}`; film.frame(t); };
  const tick = async (now) => {
    if (playing) {
      t += Math.min(0.1, (now - last) / 1000);
      if (t >= film.duration) {
        if (document.getElementById('chain').checked && cur < SCENES.length - 1) await load(cur + 1);
        else { t = film.duration - 0.01; playing = false; document.getElementById('play').textContent = '▶ Lecture'; }
      }
      film.frame(t);
      updateUI();
    }
    last = now;
    requestAnimationFrame(tick);
  };
  const start = SCENES.findIndex((s) => s.id === qs.get('scene'));
  await load(Math.max(0, start));
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
